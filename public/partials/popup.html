<!-- ============================================================
     SHARED POPUP PARTIAL — Welcome / Subscribe
     Loaded by /partials/include.js into <div id="site-popup">
     Dismiss persists per device via localStorage + cookie (1 year).
     ============================================================ -->
<div id="mdPopup" style="position:fixed;inset:0;z-index:9999;background:rgba(20,8,9,.8);backdrop-filter:blur(8px);padding:1rem;display:none;align-items:center;justify-content:center;">
  <style>
    #mdPopupCard{animation:popupIn 500ms cubic-bezier(0.34,1.56,0.64,1) forwards}
    @keyframes popupIn{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
  </style>
  <div id="mdPopupCard" style="background:linear-gradient(145deg,var(--forest-deep),var(--forest));border:1px solid rgba(156,175,136,.2);border-radius:24px;max-width:480px;width:100%;padding:3rem 2.5rem;text-align:center;position:relative;box-shadow:0 40px 80px rgba(0,0,0,.5);">
    <button id="mdPopupClose" data-md-close style="position:absolute;top:1.2rem;right:1.2rem;background:rgba(255,255,255,.1);border:none;cursor:pointer;width:32px;height:32px;border-radius:50%;color:rgba(255,255,255,.7);font-size:1rem;line-height:1;display:grid;place-items:center;" aria-label="Close">&#215;</button>
    <div style="font-family:var(--font-mono);font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;color:var(--copper-sand);margin-bottom:1rem;">Ancient Skincare Secrets</div>
    <h2 style="font-family:var(--font-display);font-size:2.2rem;font-weight:300;color:#fff;line-height:1.05;margin-bottom:.8rem;">The ritual<br/>starts <em style="font-style:italic;color:var(--copper-sand)">here.</em></h2>
    <p style="font-family:var(--font-display);font-style:italic;font-size:1rem;color:rgba(255,255,255,.7);margin-bottom:2rem;line-height:1.6;">Hand-pressed botanicals, fermented for months.<br/>Get 10% off your first order.</p>
    <form id="popupEmailForm" novalidate style="display:flex;flex-direction:column;gap:.6rem;margin-bottom:1rem;">
      <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
        <input type="email" id="popupEmailInput" name="email" required placeholder="Your email" autocomplete="email" style="flex:1;min-width:0;padding:.85rem 1rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:99px;color:#fff;font-family:var(--font-mono);font-size:.75rem;letter-spacing:.05em;outline:none;" />
        <button type="submit" id="popupEmailSubmit" style="padding:.85rem 1.4rem;background:var(--copper-med);color:#fff;border:none;border-radius:99px;font-family:var(--font-mono);font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;white-space:nowrap;">Get 10% off</button>
      </div>
      <div id="popupEmailStatus" style="display:none;font-family:var(--font-mono);font-size:.6rem;letter-spacing:.1em;text-align:center;"></div>
    </form>
    <a href="/#products" style="display:block;padding:1rem;background:var(--copper-med);color:#fff;border-radius:99px;font-family:var(--font-mono);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:.8rem;transition:background 200ms;text-decoration:none;">Shop the Collection</a>
    <button data-md-close style="background:none;border:none;cursor:pointer;font-family:var(--font-mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.4);transition:color 200ms;">No thanks, maybe later</button>
  </div>
</div>
